[tool.poetry]
name = "risingwave-mcp"
version = "0.1.1"
description = "A RisingWave MCP project using fastmcp and risingwave-py"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
fastmcp = "^0.1.0"
risingwave-py = "^0.1.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py310"
# When opening a PR, run `ruff check src/` locally. CI also enforces this on
# every supported Python version, but catching version-specific syntax issues
# early in the editor / pre-push is much cheaper than waiting on CI.

[tool.ruff.lint]
# Pin the rule set to ruff's historical defaults. ruff is installed unpinned
# in CI, and 0.17 widened its default selection, which turned 400+ pre-existing
# style findings into CI failures. Widen deliberately, with the fixes, not by
# accident of whichever ruff version pip resolves.
select = ["E4", "E7", "E9", "F"]
